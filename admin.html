<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel Admin - Central de Sensores</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Firebase App & Database (v8 SDK) -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
</head>

<body class="bg-slate-100 text-slate-800 font-sans antialiased min-h-screen pb-12">

    <!-- BARRA SUPERIOR / HEADER -->
    <header class="bg-slate-900 text-white shadow-md mb-8">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-5 flex justify-between items-center">
            <div class="flex items-center space-x-3">
                <div class="p-2 bg-indigo-600 rounded-lg">
                    <svg class="w-6 h-6 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 3v2m6-2v2M9 19v2m6-2v2M5 9H3m2 6H3m18-6h-2m2 6h-2M7 19h10a2 2 0 002-2V7a2 2 0 00-2-2H7a2 2 0 00-2 2v10a2 2 0 002 2zM9 9h6v6H9V9z"/>
                    </svg>
                </div>
                <div>
                    <h1 class="text-xl font-bold tracking-tight">Monitoramento & Gestão de Sensores</h1>
                    <p class="text-xs text-slate-400">Painel de Controlo Central de Telemetria</p>
                </div>
            </div>
            <button onclick="abrirModal()" class="bg-indigo-600 hover:bg-indigo-700 text-white font-medium px-4 py-2 rounded-lg shadow-sm transition-all duration-200 flex items-center space-x-2">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"/>
                </svg>
                <span>Novo Sensor</span>
            </button>
        </div>
    </header>

    <!-- CONTEÚDO PRINCIPAL -->
    <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
        <!-- GRID DE SENSORES (RENDERIZADO DINAMICAMENTE) -->
        <div id="grid-sensores" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
            <!-- Cards de sensores serão injetados via JavaScript -->
        </div>
    </main>

    <!-- MODAL DE CADASTRO / EDIÇÃO DE SENSOR -->
    <div id="modal" class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm flex items-center justify-center p-4 z-50 hidden">
        <div class="bg-white rounded-2xl shadow-xl w-full max-w-2xl overflow-hidden max-h-[90vh] flex flex-col">
            <!-- Cabeçalho do Modal -->
            <div class="px-6 py-4 bg-slate-50 border-b border-slate-200 flex justify-between items-center">
                <h3 id="titulo" class="text-lg font-bold text-slate-800">Novo Sensor</h3>
                <button type="button" onclick="fecharModal()" class="text-slate-400 hover:text-slate-600 text-2xl font-bold leading-none">&times;</button>
            </div>

            <!-- Formulário Completo -->
            <form onsubmit="salvar(event)" class="p-6 overflow-y-auto space-y-4">
                <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                    <div>
                        <label class="block text-xs font-semibold text-slate-600 uppercase tracking-wider mb-1">ID do Sensor</label>
                        <input type="text" id="id" placeholder="Ex: SENSOR_01" required class="w-full border border-slate-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500 disabled:bg-slate-100 disabled:text-slate-500">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-slate-600 uppercase tracking-wider mb-1">Nome / Localização</label>
                        <input type="text" id="nome" placeholder="Ex: Câmara Fria 01" required class="w-full border border-slate-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500">
                    </div>
                </div>

                <div>
                    <label class="block text-xs font-semibold text-slate-600 uppercase tracking-wider mb-1">Client ID</label>
                    <input type="text" id="cliente" placeholder="Identificador do Cliente / Empresa" class="w-full border border-slate-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500">
                </div>

                <!-- Limites de Alerta de Temperatura e Umidade -->
                <div class="bg-slate-50 p-4 rounded-xl border border-slate-200 space-y-3">
                    <span class="block text-xs font-bold text-slate-700 uppercase tracking-wider">Limites de Alerta</span>
                    <div class="grid grid-cols-2 sm:grid-cols-4 gap-3">
                        <div>
                            <label class="block text-xs font-medium text-slate-600">Temp Mín (°C)</label>
                            <input type="number" step="0.1" id="tempMin" class="w-full border border-slate-300 rounded-lg px-2 py-1.5 text-sm mt-1 focus:ring-1 focus:ring-indigo-500">
                        </div>
                        <div>
                            <label class="block text-xs font-medium text-slate-600">Temp Máx (°C)</label>
                            <input type="number" step="0.1" id="tempMax" class="w-full border border-slate-300 rounded-lg px-2 py-1.5 text-sm mt-1 focus:ring-1 focus:ring-indigo-500">
                        </div>
                        <div>
                            <label class="block text-xs font-medium text-slate-600">Umidade Mín (%)</label>
                            <input type="number" step="0.1" id="humMin" class="w-full border border-slate-300 rounded-lg px-2 py-1.5 text-sm mt-1 focus:ring-1 focus:ring-indigo-500">
                        </div>
                        <div>
                            <label class="block text-xs font-medium text-slate-600">Umidade Máx (%)</label>
                            <input type="number" step="0.1" id="humMax" class="w-full border border-slate-300 rounded-lg px-2 py-1.5 text-sm mt-1 focus:ring-1 focus:ring-indigo-500">
                        </div>
                    </div>
                </div>

                <!-- Configurações de Notificação e Intervalos -->
                <div class="grid grid-cols-1 sm:grid-cols-3 gap-3">
                    <div class="sm:col-span-3">
                        <label class="block text-xs font-semibold text-slate-600 uppercase tracking-wider mb-1">E-mail para Alertas</label>
                        <input type="email" id="emailAlerta" placeholder="alerta@empresa.com" class="w-full border border-slate-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500">
                    </div>
                    <div>
                        <label class="block text-xs font-medium text-slate-600">Freq. Registro (s)</label>
                        <input type="number" id="freqRegistro" placeholder="60" class="w-full border border-slate-300 rounded-lg px-3 py-2 text-sm mt-1 focus:ring-1 focus:ring-indigo-500">
                    </div>
                    <div>
                        <label class="block text-xs font-medium text-slate-600">Interv. Alerta (m)</label>
                        <input type="number" id="intervaloAlerta" placeholder="15" class="w-full border border-slate-300 rounded-lg px-3 py-2 text-sm mt-1 focus:ring-1 focus:ring-indigo-500">
                    </div>
                </div>

                <!-- Rotas de Comunicação (Personalizadas / Sugeridas) -->
                <div class="space-y-2 pt-3 border-t border-slate-200">
                    <span class="block text-xs font-semibold text-slate-500 uppercase tracking-wider">Mapeamento de Rotas no Firebase</span>
                    <div class="grid grid-cols-1 sm:grid-cols-3 gap-2">
                        <div>
                            <label class="block text-[10px] text-slate-500">Rota Temperatura</label>
                            <input type="text" id="rotaTemp" placeholder="/sensores/SENSOR_01/temp" class="w-full border border-slate-300 rounded px-2 py-1 text-xs">
                        </div>
                        <div>
                            <label class="block text-[10px] text-slate-500">Rota Umidade</label>
                            <input type="text" id="rotaHum" placeholder="/sensores/SENSOR_01/hum" class="w-full border border-slate-300 rounded px-2 py-1 text-xs">
                        </div>
                        <div>
                            <label class="block text-[10px] text-slate-500">Rota Last Seen</label>
                            <input type="text" id="rotaLastSeen" placeholder="/sensores/SENSOR_01/last_seen" class="w-full border border-slate-300 rounded px-2 py-1 text-xs">
                        </div>
                    </div>
                </div>

                <!-- Botoes de Ação -->
                <div class="pt-4 flex justify-end space-x-3 border-t border-slate-200">
                    <button type="button" onclick="fecharModal()" class="px-4 py-2 border border-slate-300 text-slate-700 rounded-lg text-sm font-medium hover:bg-slate-50 transition-colors">Cancelar</button>
                    <button type="submit" class="px-4 py-2 bg-indigo-600 text-white rounded-lg text-sm font-medium hover:bg-indigo-700 shadow-sm transition-colors">Salvar Alterações</button>
                </div>
            </form>
        </div>
    </div>

    <!-- SCRIPTS DE CONTROLO E LOGICA DO PAINEL -->
    <script>
        // Configuração do Firebase Realtime Database
        const firebaseConfig = {
            databaseURL: "https://triangulo-ir-default-rtdb.firebaseio.com"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        let editando = false;
        let sensorEditando = null;

        // Função utilitária para formatar segundos em horas, minutos e segundos
        function formatarTempo(segs) {
            if (!segs || segs <= 0) return "0s";
            const h = Math.floor(segs / 3600);
            const m = Math.floor((segs % 3600) / 60);
            const s = segs % 60;
            if (h > 0) return `${h}h ${m}m ${s}s`;
            if (m > 0) return `${m}m ${s}s`;
            return `${s}s`;
        }

        // Renderiza o card do sensor na página mantendo todo o layout
        function renderizarCard(id, data) {
            let card = document.getElementById(`card-${id}`);
            
            if (!card) {
                card = document.createElement("div");
                card.id = `card-${id}`;
                card.className = "bg-white rounded-xl shadow-sm border border-slate-200 overflow-hidden hover:shadow-md transition-shadow duration-200 flex flex-col justify-between";
                document.getElementById("grid-sensores").appendChild(card);
            }

            card.innerHTML = `
                <div class="p-5">
                    <!-- Topo do Card -->
                    <div class="flex justify-between items-start mb-3">
                        <div>
                            <span class="text-xs font-bold text-indigo-600 tracking-wider uppercase">${id}</span>
                            <h2 class="text-lg font-bold text-slate-800 leading-tight">${data.nome || "Sem Nome"}</h2>
                            <p class="text-xs text-slate-500">${data.clientID ? "Cliente: " + data.clientID : "Cliente não especificado"}</p>
                        </div>
                        <div class="flex flex-col items-end gap-1">
                            <span id="online-${id}" class="text-xs font-bold px-2 py-0.5 rounded-full bg-slate-100 text-slate-600">● Carregando</span>
                            <span id="porta-${id}" class="text-xs font-semibold px-2.5 py-0.5 rounded-full bg-slate-100 text-slate-500 border border-slate-200">
                                🚪 --
                            </span>
                        </div>
                    </div>

                    <!-- Bloco Principal: Temperatura & Umidade (Idêntico ao Original) -->
                    <div class="grid grid-cols-2 gap-3 my-4 bg-slate-50 p-3 rounded-lg border border-slate-100">
                        <div>
                            <span class="text-xs text-slate-500 block font-medium">Temperatura</span>
                            <span id="temp-${id}" class="text-xl font-extrabold text-slate-700">-- °C</span>
                        </div>
                        <div>
                            <span class="text-xs text-slate-500 block font-medium">Umidade</span>
                            <span id="hum-${id}" class="text-xl font-extrabold text-slate-700">-- %</span>
                        </div>
                    </div>

                    <!-- Rodapé com Informações de Visto por Último -->
                    <div class="text-xs text-slate-400 space-y-1">
                        <div class="flex justify-between">
                            <span>Visto por último:</span>
                            <span id="seen-${id}" class="font-medium text-slate-600">--:--:--</span>
                        </div>
                    </div>
                </div>

                <!-- Ações do Sensor -->
                <div class="px-5 py-3 bg-slate-50 border-t border-slate-100 flex justify-between items-center text-xs">
                    <button onclick="editar('${id}')" class="text-indigo-600 font-semibold hover:text-indigo-800 flex items-center space-x-1">
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z"/></svg>
                        <span>Configurar</span>
                    </button>
                    <button onclick="excluir('${id}')" class="text-rose-500 font-semibold hover:text-rose-700 flex items-center space-x-1">
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"/></svg>
                        <span>Excluir</span>
                    </button>
                </div>
            `;

            // Escuta em Tempo Real do Firebase para o Sensor Ativo
            db.ref(`sensores/${id}`).on("value", snapshot => {
                const sData = snapshot.val() || {};

                // 1. Atualizar Leituras de Temperatura e Umidade
                const elTemp = document.getElementById(`temp-${id}`);
                const elHum = document.getElementById(`hum-${id}`);
                
                if (elTemp) {
                    elTemp.textContent = (sData.temp !== undefined && sData.temp !== null) 
                        ? `${parseFloat(sData.temp).toFixed(1)} °C` 
                        : "-- °C";
                }
                
                if (elHum) {
                    elHum.textContent = (sData.hum !== undefined && sData.hum !== null) 
                        ? `${parseFloat(sData.hum).toFixed(1)} %` 
                        : "-- %";
                }

                // 2. Atualizar Estado da Conexão / Timestamp
                if (sData.last_seen) {
                    atualizarOnline(id, sData.last_seen);
                }

                // 3. Atualizar Estado da Porta
                const elPorta = document.getElementById(`porta-${id}`);
                if (elPorta) {
                    const portaAberta = sData.porta_aberta === true || sData.porta_aberta === "true";
                    const tempoSegs = parseInt(sData.tempo_aberta_segs) || 0;

                    if (portaAberta) {
                        const tempoTxt = tempoSegs > 0 ? ` (${formatarTempo(tempoSegs)})` : "";
                        elPorta.textContent = `🚪 Porta Aberta${tempoTxt}`;
                        elPorta.className = "text-xs font-bold px-2.5 py-0.5 rounded-full bg-rose-100 text-rose-700 border border-rose-300 animate-pulse";
                    } else {
                        elPorta.textContent = "🚪 Porta Fechada";
                        elPorta.className = "text-xs font-semibold px-2.5 py-0.5 rounded-full bg-emerald-100 text-emerald-700 border border-emerald-300";
                    }
                }
            });
        }

        // Eventos Globais de Monitorização dos Sensores Cadastrados
        db.ref("central_sensores").on("child_added", snapshot => {
            renderizarCard(snapshot.key, snapshot.val());
        });

        db.ref("central_sensores").on("child_changed", snapshot => {
            renderizarCard(snapshot.key, snapshot.val());
        });

        db.ref("central_sensores").on("child_removed", snapshot => {
            const card = document.getElementById(`card-${snapshot.key}`);
            if (card) card.remove();
        });

        // Atualização dos Indicadores de Conexão Online/Offline
        function atualizarOnline(id, timestamp) {
            if (!Number.isFinite(Number(timestamp))) return;
            let ts = Number(timestamp);
            if (ts > 100000000000) ts = Math.floor(ts / 1000);

            const segundos = Math.floor(Date.now() / 1000) - ts;
            const online = segundos >= 0 && segundos < 60;

            const elemento = document.getElementById(`online-${id}`);
            const hora = document.getElementById(`seen-${id}`);

            if (!elemento) return;

            if (online) {
                elemento.textContent = "● Online";
                elemento.className = "text-xs font-bold px-2 py-0.5 rounded-full bg-emerald-100 text-emerald-700 border border-emerald-300";
            } else {
                elemento.textContent = "● Offline";
                elemento.className = "text-xs font-bold px-2 py-0.5 rounded-full bg-slate-100 text-slate-500 border border-slate-200";
            }

            if (hora) {
                hora.textContent = new Date(ts * 1000).toLocaleTimeString("pt-BR");
            }
        }

        // Funções da Modal
        function abrirModal() {
            editando = false;
            sensorEditando = null;
            document.getElementById("titulo").textContent = "Novo Sensor";
            document.querySelector("form").reset();
            const campoId = document.getElementById("id");
            campoId.disabled = false;
            campoId.oninput = sugerirRotas;
            document.getElementById("modal").classList.remove("hidden");
        }

        function sugerirRotas() {
            if (editando) return;
            const valor = document.getElementById("id").value.trim().toUpperCase();
            const resultado = valor.match(/^SENSOR_(\d+)$/);
            if (!resultado) return;

            const numero = Number(resultado[1]);
            const idFormatado = `SENSOR_${String(numero).padStart(2, '0')}`;

            document.getElementById("rotaTemp").value = `/sensores/${idFormatado}/temp`;
            document.getElementById("rotaHum").value = `/sensores/${idFormatado}/hum`;
            document.getElementById("rotaLastSeen").value = `/sensores/${idFormatado}/last_seen`;
        }

        function fecharModal() {
            document.getElementById("modal").classList.add("hidden");
        }

        function editar(id) {
            db.ref(`central_sensores/${id}`).once("value").then(snapshot => {
                if (!snapshot.exists()) {
                    alert("Sensor não encontrado.");
                    return;
                }

                const s = snapshot.val();
                editando = true;
                sensorEditando = id;

                document.getElementById("titulo").textContent = "Painel de Serviço: " + id;
                const campoId = document.getElementById("id");
                campoId.value = id;
                campoId.disabled = true;
                campoId.oninput = null;

                document.getElementById("nome").value = s.nome || "";
                document.getElementById("cliente").value = s.clientID || "";
                document.getElementById("tempMin").value = s.tempMin !== undefined && s.tempMin !== null ? s.tempMin : "";
                document.getElementById("tempMax").value = s.tempMax !== undefined && s.tempMax !== null ? s.tempMax : "";
                document.getElementById("humMin").value = s.humMin !== undefined && s.humMin !== null ? s.humMin : "";
                document.getElementById("humMax").value = s.humMax !== undefined && s.humMax !== null ? s.humMax : "";
                document.getElementById("emailAlerta").value = s.emailAlerta || "";
                document.getElementById("freqRegistro").value = s.freqRegistro || "";
                document.getElementById("intervaloAlerta").value = s.intervaloAlerta || "";
                document.getElementById("rotaTemp").value = s.rotaTemp || "";
                document.getElementById("rotaHum").value = s.rotaHum || "";
                document.getElementById("rotaLastSeen").value = s.rotaLastSeen || "";

                document.getElementById("modal").classList.remove("hidden");
            }).catch(error => {
                console.error(error);
                alert("Erro ao carregar dados do sensor.");
            });
        }

        function salvar(event) {
            event.preventDefault();
            const id = document.getElementById("id").value.trim().toUpperCase().replace(/\s+/g, "_");

            const dados = {
                nome: document.getElementById("nome").value.trim(),
                clientID: document.getElementById("cliente").value.trim(),
                tempMin: parseFloat(document.getElementById("tempMin").value) || null,
                tempMax: parseFloat(document.getElementById("tempMax").value) || null,
                humMin: parseFloat(document.getElementById("humMin").value) || null,
                humMax: parseFloat(document.getElementById("humMax").value) || null,
                emailAlerta: document.getElementById("emailAlerta").value.trim(),
                freqRegistro: parseInt(document.getElementById("freqRegistro").value) || 60,
                intervaloAlerta: parseInt(document.getElementById("intervaloAlerta").value) || 15,
                rotaTemp: document.getElementById("rotaTemp").value.trim(),
                rotaHum: document.getElementById("rotaHum").value.trim(),
                rotaLastSeen: document.getElementById("rotaLastSeen").value.trim()
            };

            db.ref(`central_sensores/${id}`).update(dados).then(() => {
                alert(editando ? "Configurações atualizadas!" : "Sensor cadastrado!");
                fecharModal();
            }).catch(error => {
                console.error(error);
                alert("Erro ao salvar alterações no Firebase.");
            });
        }

        function excluir(id) {
            if (!confirm(`Deseja excluir permanentemente o ${id}?`)) return;

            db.ref(`central_sensores/${id}`).remove().then(() => {
                alert("Sensor removido com sucesso.");
            }).catch(error => {
                console.error(error);
                alert("Erro ao excluir.");
            });
        }
    </script>
</body>

</html>
