<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel de Monitoramento - Central NewEnergy</title>

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <!-- Firebase SDKs (v8) -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-messaging.js"></script>

    <!-- EmailJS SDK -->
    <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/@emailjs/browser@3/dist/email.min.js"></script>

    <style>
        .glass {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
        }

        .pulse-red {
            animation: pulse-red-animation 1.5s infinite;
        }

        @keyframes pulse-red-animation {
            0% {
                box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.7);
            }

            70% {
                box-shadow: 0 0 0 10px rgba(239, 68, 68, 0);
            }

            100% {
                box-shadow: 0 0 0 0 rgba(239, 68, 68, 0);
            }
        }
    </style>
</head>

<body class="bg-slate-100 min-h-screen text-slate-800 font-sans antialiased">

    <!-- Navbar -->
    <nav class="bg-slate-900 text-white shadow-lg border-b border-slate-800 sticky top-0 z-40">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex items-center justify-between h-16">
                <div class="flex items-center space-x-3">
                    <i class="fa-solid fa-bolt text-amber-400 text-2xl"></i>
                    <span class="font-bold text-xl tracking-wide">Central NewEnergy</span>
                </div>
                <div class="flex items-center space-x-4">
                    <button id="btnNovoSensor" onclick="abrirModalNovo()"
                        class="bg-blue-600 hover:bg-blue-700 text-white px-4 py-2 rounded-lg font-medium text-sm transition flex items-center space-x-2 shadow">
                        <i class="fa-solid fa-plus"></i>
                        <span>Novo Sensor</span>
                    </button>
                    <button id="btnLogout" onclick="logout()"
                        class="bg-slate-800 hover:bg-red-600 text-slate-300 hover:text-white px-3 py-2 rounded-lg text-sm transition">
                        <i class="fa-solid fa-right-from-bracket"></i>
                    </button>
                </div>
            </div>
        </div>
    </nav>

    <!-- Main Container -->
    <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
        
        <!-- Header Metrics / Summary -->
        <div class="grid grid-cols-1 md:grid-cols-4 gap-4 mb-8">
            <div class="bg-white p-5 rounded-xl shadow-sm border border-slate-200 flex items-center justify-between">
                <div>
                    <p class="text-xs font-semibold text-slate-500 uppercase tracking-wider">Total de Sensores</p>
                    <h3 id="statTotal" class="text-2xl font-bold text-slate-800 mt-1">0</h3>
                </div>
                <div class="w-12 h-12 bg-blue-50 text-blue-600 rounded-lg flex items-center justify-center text-xl">
                    <i class="fa-solid fa-microchip"></i>
                </div>
            </div>
            
            <div class="bg-white p-5 rounded-xl shadow-sm border border-slate-200 flex items-center justify-between">
                <div>
                    <p class="text-xs font-semibold text-slate-500 uppercase tracking-wider">Online</p>
                    <h3 id="statOnline" class="text-2xl font-bold text-emerald-600 mt-1">0</h3>
                </div>
                <div class="w-12 h-12 bg-emerald-50 text-emerald-600 rounded-lg flex items-center justify-center text-xl">
                    <i class="fa-solid fa-wifi"></i>
                </div>
            </div>

            <div class="bg-white p-5 rounded-xl shadow-sm border border-slate-200 flex items-center justify-between">
                <div>
                    <p class="text-xs font-semibold text-slate-500 uppercase tracking-wider">Alertas Ativos</p>
                    <h3 id="statAlertas" class="text-2xl font-bold text-red-600 mt-1">0</h3>
                </div>
                <div class="w-12 h-12 bg-red-50 text-red-600 rounded-lg flex items-center justify-center text-xl">
                    <i class="fa-solid fa-triangle-exclamation"></i>
                </div>
            </div>

            <div class="bg-white p-5 rounded-xl shadow-sm border border-slate-200 flex items-center justify-between">
                <div>
                    <p class="text-xs font-semibold text-slate-500 uppercase tracking-wider">Portas Abertas</p>
                    <h3 id="statPortasAbertas" class="text-2xl font-bold text-amber-600 mt-1">0</h3>
                </div>
                <div class="w-12 h-12 bg-amber-50 text-amber-600 rounded-lg flex items-center justify-center text-xl">
                    <i class="fa-solid fa-door-open"></i>
                </div>
            </div>
        </div>

        <!-- Section Title & Search -->
        <div class="flex flex-col md:flex-row md:items-center justify-between mb-6 gap-4">
            <h2 class="text-xl font-bold text-slate-800 flex items-center space-x-2">
                <i class="fa-solid fa-gauge-high text-blue-600"></i>
                <span>Monitoramento em Tempo Real</span>
            </h2>
            <div class="relative w-full md:w-72">
                <input type="text" id="inputBusca" onkeyup="filtrarSensores()" placeholder="Buscar por ID ou Nome..."
                    class="w-full pl-10 pr-4 py-2 rounded-lg border border-slate-300 focus:ring-2 focus:ring-blue-500 focus:border-transparent text-sm bg-white shadow-sm">
                <i class="fa-solid fa-magnifying-glass absolute left-3 top-3 text-slate-400 text-sm"></i>
            </div>
        </div>

        <!-- Grid de Cards de Sensores -->
        <div id="gridSensores" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
            <!-- Cards gerados dinamicamente via JS -->
        </div>

    </main>

    <!-- Modal Modal Form (Cadastro/Edição) -->
    <div id="modal" class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm flex items-center justify-center p-4 z-50 hidden">
        <div class="bg-white rounded-2xl shadow-2xl max-w-2xl w-full max-h-[90vh] overflow-y-auto border border-slate-100">
            
            <div class="p-6 border-b border-slate-100 flex justify-between items-center bg-slate-50">
                <h3 id="modalTitulo" class="text-lg font-bold text-slate-800">Configurar Sensor</h3>
                <button onclick="fecharModal()" class="text-slate-400 hover:text-slate-600 p-2 rounded-lg">
                    <i class="fa-solid fa-xmark text-xl"></i>
                </button>
            </div>

            <form id="formSensor" onsubmit="salvar(event)" class="p-6 space-y-4">
                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <div>
                        <label class="block text-xs font-bold text-slate-600 uppercase mb-1">ID do Sensor *</label>
                        <input type="text" id="id" required placeholder="EX: SENSOR_01"
                            class="w-full px-3 py-2 border border-slate-300 rounded-lg text-sm focus:ring-2 focus:ring-blue-500">
                    </div>
                    <div>
                        <label class="block text-xs font-bold text-slate-600 uppercase mb-1">Nome de Exibição</label>
                        <input type="text" id="nome" placeholder="EX: Câmara Fria 1"
                            class="w-full px-3 py-2 border border-slate-300 rounded-lg text-sm focus:ring-2 focus:ring-blue-500">
                    </div>
                </div>

                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <div>
                        <label class="block text-xs font-bold text-slate-600 uppercase mb-1">ID Cliente / Unidade</label>
                        <input type="text" id="cliente" placeholder="EX: CLI_123"
                            class="w-full px-3 py-2 border border-slate-300 rounded-lg text-sm focus:ring-2 focus:ring-blue-500">
                    </div>
                    <div>
                        <label class="block text-xs font-bold text-slate-600 uppercase mb-1">E-mail de Alerta</label>
                        <input type="email" id="emailAlerta" placeholder="alertas@empresa.com"
                            class="w-full px-3 py-2 border border-slate-300 rounded-lg text-sm focus:ring-2 focus:ring-blue-500">
                    </div>
                </div>

                <div class="border-t border-slate-200 pt-4 mt-2">
                    <h4 class="text-xs font-bold text-slate-400 uppercase tracking-wider mb-3">Limites de Temperatura (°C)</h4>
                    <div class="grid grid-cols-2 gap-4">
                        <div>
                            <label class="block text-xs font-medium text-slate-600 mb-1">Mínima (°C)</label>
                            <input type="number" step="0.1" id="tempMin" placeholder="2.0"
                                class="w-full px-3 py-2 border border-slate-300 rounded-lg text-sm focus:ring-2 focus:ring-blue-500">
                        </div>
                        <div>
                            <label class="block text-xs font-medium text-slate-600 mb-1">Máxima (°C)</label>
                            <input type="number" step="0.1" id="tempMax" placeholder="8.0"
                                class="w-full px-3 py-2 border border-slate-300 rounded-lg text-sm focus:ring-2 focus:ring-blue-500">
                        </div>
                    </div>
                </div>

                <div class="border-t border-slate-200 pt-4">
                    <h4 class="text-xs font-bold text-slate-400 uppercase tracking-wider mb-3">Limites de Umidade (%)</h4>
                    <div class="grid grid-cols-2 gap-4">
                        <div>
                            <label class="block text-xs font-medium text-slate-600 mb-1">Mínima (%)</label>
                            <input type="number" step="0.1" id="humMin" placeholder="30.0"
                                class="w-full px-3 py-2 border border-slate-300 rounded-lg text-sm focus:ring-2 focus:ring-blue-500">
                        </div>
                        <div>
                            <label class="block text-xs font-medium text-slate-600 mb-1">Máxima (%)</label>
                            <input type="number" step="0.1" id="humMax" placeholder="70.0"
                                class="w-full px-3 py-2 border border-slate-300 rounded-lg text-sm focus:ring-2 focus:ring-blue-500">
                        </div>
                    </div>
                </div>

                <div class="border-t border-slate-200 pt-4">
                    <h4 class="text-xs font-bold text-slate-400 uppercase tracking-wider mb-3">Monitoramento da Porta</h4>
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                        <div>
                            <label class="block text-xs font-medium text-slate-600 mb-1">Rota Porta (RTDB)</label>
                            <input type="text" id="rotaPorta" placeholder="ex: sensores/s01/porta"
                                class="w-full px-3 py-2 border border-slate-300 rounded-lg text-sm focus:ring-2 focus:ring-blue-500">
                        </div>
                        <div>
                            <label class="block text-xs font-medium text-slate-600 mb-1">Tempo Limite Porta Aberta (Minutos)</label>
                            <input type="number" id="tempoLimitePorta" placeholder="5"
                                class="w-full px-3 py-2 border border-slate-300 rounded-lg text-sm focus:ring-2 focus:ring-blue-500">
                        </div>
                    </div>
                </div>

                <div class="border-t border-slate-200 pt-4">
                    <h4 class="text-xs font-bold text-slate-400 uppercase tracking-wider mb-3">Configurações de Intervalo (Segundos/Minutos)</h4>
                    <div class="grid grid-cols-2 gap-4">
                        <div>
                            <label class="block text-xs font-medium text-slate-600 mb-1">Freq. Registro (seg)</label>
                            <input type="number" id="freqRegistro" placeholder="60"
                                class="w-full px-3 py-2 border border-slate-300 rounded-lg text-sm focus:ring-2 focus:ring-blue-500">
                        </div>
                        <div>
                            <label class="block text-xs font-medium text-slate-600 mb-1">Intervalo Alerta (min)</label>
                            <input type="number" id="intervaloAlerta" placeholder="15"
                                class="w-full px-3 py-2 border border-slate-300 rounded-lg text-sm focus:ring-2 focus:ring-blue-500">
                        </div>
                    </div>
                </div>

                <div class="border-t border-slate-200 pt-4">
                    <h4 class="text-xs font-bold text-slate-400 uppercase tracking-wider mb-3">Rotas no Firebase Realtime Database</h4>
                    <div class="grid grid-cols-1 md:grid-cols-3 gap-3">
                        <div>
                            <label class="block text-xs font-medium text-slate-600 mb-1">Rota Temp</label>
                            <input type="text" id="rotaTemp" placeholder="sensores/s01/temp"
                                class="w-full px-3 py-2 border border-slate-300 rounded-lg text-sm focus:ring-2 focus:ring-blue-500">
                        </div>
                        <div>
                            <label class="block text-xs font-medium text-slate-600 mb-1">Rota Hum</label>
                            <input type="text" id="rotaHum" placeholder="sensores/s01/hum"
                                class="w-full px-3 py-2 border border-slate-300 rounded-lg text-sm focus:ring-2 focus:ring-blue-500">
                        </div>
                        <div>
                            <label class="block text-xs font-medium text-slate-600 mb-1">Rota LastSeen</label>
                            <input type="text" id="rotaLastSeen" placeholder="sensores/s01/ts"
                                class="w-full px-3 py-2 border border-slate-300 rounded-lg text-sm focus:ring-2 focus:ring-blue-500">
                        </div>
                    </div>
                </div>

                <div class="flex justify-end space-x-3 border-t border-slate-100 pt-4 mt-6">
                    <button type="button" onclick="fecharModal()"
                        class="px-4 py-2 border border-slate-300 text-slate-600 rounded-lg text-sm hover:bg-slate-50 transition">
                        Cancelar
                    </button>
                    <button type="submit"
                        class="px-5 py-2 bg-blue-600 hover:bg-blue-700 text-white rounded-lg text-sm font-medium transition shadow">
                        Salvar Sensor
                    </button>
                </div>
            </form>
        </div>
    </div>

    <!-- Logic Script -->
    <script>
        // Firebase Configuração (Substitua com suas chaves)
        const firebaseConfig = {
            apiKey: "SUA_API_KEY",
            authDomain: "SEU_PROJETO.firebaseapp.com",
            databaseURL: "https://SEU_PROJETO-default-rtdb.firebaseio.com",
            projectId: "SEU_PROJETO",
            storageBucket: "SEU_PROJETO.appspot.com",
            messagingSenderId: "123456789",
            appId: "1:123456789:web:abcdef"
        };

        // Inicializa Firebase
        if (!firebase.apps.length) {
            firebase.initializeApp(firebaseConfig);
        }

        const db = firebase.database();
        const auth = firebase.auth();

        // Inicializa EmailJS (Substitua pela sua PUBLIC_KEY)
        (function () {
            emailjs.init("SUA_EMAILJS_PUBLIC_KEY");
        })();

        let editando = false;
        let todosSensores = {};
        let listenersAtivos = {};
        let ultimaNotificacaoPorta = {};

        // Inicialização e Monitoramento Realtime
        document.addEventListener("DOMContentLoaded", () => {
            carregarSensores();
        });

        function carregarSensores() {
            db.ref("central_sensores").on("value", (snapshot) => {
                const data = snapshot.val() || {};
                todosSensores = data;
                renderizarCards(data);
                atualizarEstatisticas(data);
                sincronizarListenersOtimizados(data);
            });
        }

        function renderizarCards(sensores) {
            const container = document.getElementById("gridSensores");
            container.innerHTML = "";

            if (Object.keys(sensores).length === 0) {
                container.innerHTML = `
                    <div class="col-span-full text-center py-12 bg-white rounded-xl border border-dashed border-slate-300">
                        <i class="fa-solid fa-microchip text-4xl text-slate-300 mb-3"></i>
                        <p class="text-slate-500 font-medium">Nenhum sensor cadastrado até o momento.</p>
                        <button onclick="abrirModalNovo()" class="mt-3 text-blue-600 hover:underline text-sm font-semibold">
                            + Cadastrar Primeiro Sensor
                        </button>
                    </div>
                `;
                return;
            }

            for (const [id, s] of Object.entries(sensores)) {
                const card = document.createElement("div");
                card.id = `card_${id}`;
                card.className = "bg-white rounded-xl shadow-sm border border-slate-200 overflow-hidden hover:shadow-md transition flex flex-col justify-between";

                card.innerHTML = `
                    <div>
                        <div class="p-5 border-b border-slate-100 flex items-center justify-between bg-slate-50/50">
                            <div>
                                <h3 class="font-bold text-slate-800">${s.nome || id}</h3>
                                <p class="text-xs text-slate-400 font-mono">${id} ${s.clientID ? '| ' + s.clientID : ''}</p>
                            </div>
                            <div class="flex items-center space-x-2">
                                <span id="status_${id}" class="px-2.5 py-1 rounded-full text-xs font-semibold bg-slate-100 text-slate-500">
                                    Aguardando...
                                </span>
                                <button onclick="editar('${id}')" class="text-slate-400 hover:text-blue-600 p-1">
                                    <i class="fa-solid fa-pen-to-square"></i>
                                </button>
                                <button onclick="excluir('${id}')" class="text-slate-400 hover:text-red-600 p-1">
                                    <i class="fa-solid fa-trash"></i>
                                </button>
                            </div>
                        </div>

                        <div class="p-5 grid grid-cols-2 gap-4">
                            <!-- Temperatura -->
                            <div class="bg-slate-50 p-3 rounded-lg border border-slate-100">
                                <span class="text-xs text-slate-400 uppercase font-semibold flex items-center space-x-1">
                                    <i class="fa-solid fa-temperature-half text-red-400"></i>
                                    <span>Temperatura</span>
                                </span>
                                <div class="mt-1 flex items-baseline justify-between">
                                    <span id="val_temp_${id}" class="text-2xl font-bold text-slate-700">--</span>
                                    <span class="text-xs text-slate-400">°C</span>
                                </div>
                                <div class="text-[10px] text-slate-400 mt-1">
                                    Min: ${s.tempMin ?? '--'} | Max: ${s.tempMax ?? '--'}
                                </div>
                            </div>

                            <!-- Umidade -->
                            <div class="bg-slate-50 p-3 rounded-lg border border-slate-100">
                                <span class="text-xs text-slate-400 uppercase font-semibold flex items-center space-x-1">
                                    <i class="fa-solid fa-droplet text-blue-400"></i>
                                    <span>Umidade</span>
                                </span>
                                <div class="mt-1 flex items-baseline justify-between">
                                    <span id="val_hum_${id}" class="text-2xl font-bold text-slate-700">--</span>
                                    <span class="text-xs text-slate-400">%</span>
                                </div>
                                <div class="text-[10px] text-slate-400 mt-1">
                                    Min: ${s.humMin ?? '--'} | Max: ${s.humMax ?? '--'}
                                </div>
                            </div>
                        </div>

                        <!-- Monitoramento da Porta -->
                        <div class="px-5 pb-3">
                            <div class="bg-slate-50 p-3 rounded-lg border border-slate-100 flex items-center justify-between">
                                <div class="flex items-center space-x-2">
                                    <i id="icon_porta_${id}" class="fa-solid fa-door-closed text-slate-400 text-lg"></i>
                                    <div>
                                        <p class="text-xs font-bold text-slate-600">Status da Porta</p>
                                        <p id="time_porta_${id}" class="text-[10px] text-slate-400">Sem dados</p>
                                    </div>
                                </div>
                                <span id="val_porta_${id}" class="text-xs font-bold px-2 py-1 rounded bg-slate-200 text-slate-600">
                                    --
                                </span>
                            </div>
                        </div>
                    </div>

                    <div class="px-5 py-3 bg-slate-50 border-t border-slate-100 flex items-center justify-between text-xs text-slate-400">
                        <span>Visto por último:</span>
                        <span id="val_last_${id}" class="font-mono">--</span>
                    </div>
                `;

                container.appendChild(card);
            }
        }

        function sincronizarListenersOtimizados(sensores) {
            // Limpa ouvintes antigos descontinuados
            for (const key in listenersAtivos) {
                if (!sensores[key]) {
                    db.ref(listenersAtivos[key].path).off();
                    delete listenersAtivos[key];
                }
            }

            // Atribui e escuta novos paths
            for (const [id, s] of Object.entries(sensores)) {
                
                // Monitoramento Temp
                if (s.rotaTemp) {
                    db.ref(s.rotaTemp).on("value", (snap) => {
                        const val = snap.val();
                        const el = document.getElementById(`val_temp_${id}`);
                        if (el) el.innerText = val !== null ? parseFloat(val).toFixed(1) : "--";
                        verificarLimites(id, s, val, 'temp');
                    });
                }

                // Monitoramento Umidade
                if (s.rotaHum) {
                    db.ref(s.rotaHum).on("value", (snap) => {
                        const val = snap.val();
                        const el = document.getElementById(`val_hum_${id}`);
                        if (el) el.innerText = val !== null ? parseFloat(val).toFixed(1) : "--";
                        verificarLimites(id, s, val, 'hum');
                    });
                }

                // Monitoramento Timestamp / Visto por Último
                if (s.rotaLastSeen) {
                    db.ref(s.rotaLastSeen).on("value", (snap) => {
                        const val = snap.val();
                        const el = document.getElementById(`val_last_${id}`);
                        const statusEl = document.getElementById(`status_${id}`);
                        if (el && val) {
                            const date = new Date(val);
                            el.innerText = date.toLocaleTimeString();
                            
                            // Define Online/Offline baseando em 3 minutos
                            const diff = (new Date() - date) / 1000;
                            if (diff < 180) {
                                statusEl.className = "px-2.5 py-1 rounded-full text-xs font-semibold bg-emerald-100 text-emerald-700";
                                statusEl.innerText = "Online";
                            } else {
                                statusEl.className = "px-2.5 py-1 rounded-full text-xs font-semibold bg-slate-100 text-slate-500";
                                statusEl.innerText = "Offline";
                            }
                        }
                    });
                }

                // Monitoramento Especial da Porta
                if (s.rotaPorta) {
                    db.ref(s.rotaPorta).on("value", (snap) => {
                        const val = snap.val();
                        processarStatusPorta(id, s, val);
                    });
                }
            }
        }

        function processarStatusPorta(id, sensor, dadosPorta) {
            const valEl = document.getElementById(`val_porta_${id}`);
            const iconEl = document.getElementById(`icon_porta_${id}`);
            const timeEl = document.getElementById(`time_porta_${id}`);

            if (!valEl || dadosPorta === null) return;

            let aberta = false;
            let desde = null;

            if (typeof dadosPorta === "boolean") {
                aberta = dadosPorta;
            } else if (typeof dadosPorta === "object") {
                aberta = dadosPorta.aberta || dadosPorta.status === "aberta" || dadosPorta.status === true;
                desde = dadosPorta.desde || dadosPorta.timestamp;
            } else if (typeof dadosPorta === "string") {
                aberta = dadosPorta.toLowerCase() === "aberta" || dadosPorta.toLowerCase() === "true";
            }

            if (aberta) {
                valEl.className = "text-xs font-bold px-2 py-1 rounded bg-red-100 text-red-600 animate-pulse";
                valEl.innerText = "ABERTA";
                iconEl.className = "fa-solid fa-door-open text-red-500 text-lg";

                const tempoLimiteMin = sensor.tempoLimitePorta || 5;
                
                if (desde) {
                    const dataInicio = new Date(desde);
                    const minutosAberta = Math.floor((new Date() - dataInicio) / 60000);
                    timeEl.innerText = `Aberta há ${minutosAberta} min`;

                    if (minutosAberta >= tempoLimiteMin) {
                        dispararAlertaPortaAberta(id, sensor, minutosAberta);
                    }
                } else {
                    timeEl.innerText = "Tempo indeterminado";
                }
            } else {
                valEl.className = "text-xs font-bold px-2 py-1 rounded bg-emerald-100 text-emerald-600";
                valEl.innerText = "FECHADA";
                iconEl.className = "fa-solid fa-door-closed text-emerald-500 text-lg";
                timeEl.innerText = "Segura";
            }
        }

        function dispararAlertaPortaAberta(id, sensor, minutosAberta) {
            const agora = Date.now();
            const ultimoAlerta = ultimaNotificacaoPorta[id] || 0;
            const intervaloMs = (sensor.intervaloAlerta || 15) * 60 * 1000;

            if (agora - ultimoAlerta > intervaloMs) {
                ultimaNotificacaoPorta[id] = agora;

                console.warn(`[ALERTA] Porta do sensor ${sensor.nome || id} está aberta por mais de ${minutosAberta} minutos!`);

                if (sensor.emailAlerta) {
                    emailjs.send("YOUR_SERVICE_ID", "YOUR_TEMPLATE_ID", {
                        to_email: sensor.emailAlerta,
                        sensor_id: id,
                        sensor_nome: sensor.nome || id,
                        mensagem: `Atenção: A porta do sensor ${sensor.nome || id} está ABERTA há mais de ${minutosAberta} minutos (Limite: ${sensor.tempoLimitePorta || 5} min).`
                    }).then(() => {
                        console.log(`Email de alerta de porta enviada para ${sensor.emailAlerta}`);
                    }).catch(err => console.error("Falha ao enviar e-mail via EmailJS:", err));
                }
            }
        }

        function verificarLimites(id, sensor, valor, tipo) {
            if (valor === null || valor === undefined) return;

            let excedeu = false;
            let msg = "";

            if (tipo === 'temp') {
                if (sensor.tempMin !== null && valor < sensor.tempMin) {
                    excedeu = true;
                    msg = `Temperatura abaixo do mínimo (${valor}°C < ${sensor.tempMin}°C)`;
                } else if (sensor.tempMax !== null && valor > sensor.tempMax) {
                    excedeu = true;
                    msg = `Temperatura acima do máximo (${valor}°C > ${sensor.tempMax}°C)`;
                }
            } else if (tipo === 'hum') {
                if (sensor.humMin !== null && valor < sensor.humMin) {
                    excedeu = true;
                    msg = `Umidade abaixo do mínimo (${valor}% < ${sensor.humMin}%)`;
                } else if (sensor.humMax !== null && valor > sensor.humMax) {
                    excedeu = true;
                    msg = `Umidade acima do máximo (${valor}% > ${sensor.humMax}%)`;
                }
            }

            if (excedeu) {
                const card = document.getElementById(`card_${id}`);
                if (card) card.classList.add("border-red-500", "pulse-red");
            }
        }

        function atualizarEstatisticas(sensores) {
            const list = Object.values(sensores);
            document.getElementById("statTotal").innerText = list.length;
        }

        function filtrarSensores() {
            const query = document.getElementById("inputBusca").value.toLowerCase();
            for (const id in todosSensores) {
                const s = todosSensores[id];
                const card = document.getElementById(`card_${id}`);
                if (card) {
                    const match = id.toLowerCase().includes(query) || (s.nome && s.nome.toLowerCase().includes(query));
                    card.style.display = match ? "flex" : "none";
                }
            }
        }

        function abrirModalNovo() {
            editando = false;
            document.getElementById("formSensor").reset();
            document.getElementById("id").readOnly = false;
            document.getElementById("modalTitulo").innerText = "Cadastrar Novo Sensor";
            document.getElementById("modal").classList.remove("hidden");
        }

        function fecharModal() {
            document.getElementById("modal").classList.add("hidden");
        }

        function editar(id) {
            editando = true;
            db.ref(`central_sensores/${id}`).once("value").then(snapshot => {
                const s = snapshot.val();
                if (!s) return;

                document.getElementById("modalTitulo").innerText = `Editar Sensor: ${id}`;
                document.getElementById("id").value = id;
                document.getElementById("id").readOnly = true;

                document.getElementById("nome").value = s.nome || "";
                document.getElementById("cliente").value = s.clientID || "";
                document.getElementById("tempMin").value = s.tempMin !== undefined && s.tempMin !== null ? s.tempMin : "";
                document.getElementById("tempMax").value = s.tempMax !== undefined && s.tempMax !== null ? s.tempMax : "";
                document.getElementById("humMin").value = s.humMin !== undefined && s.humMin !== null ? s.humMin : "";
                document.getElementById("humMax").value = s.humMax !== undefined && s.humMax !== null ? s.humMax : "";
                document.getElementById("emailAlerta").value = s.emailAlerta || "";
                document.getElementById("freqRegistro").value = s.freqRegistro || "";
                document.getElementById("intervaloAlerta").value = s.intervaloAlerta || "";
                document.getElementById("rotaTemp").value = s.rotaTemp || "";
                document.getElementById("rotaHum").value = s.rotaHum || "";
                document.getElementById("rotaLastSeen").value = s.rotaLastSeen || "";

                // Configurações do Monitoramento da Porta
                document.getElementById("rotaPorta").value = s.rotaPorta || "";
                document.getElementById("tempoLimitePorta").value = s.tempoLimitePorta || "";

                document.getElementById("modal").classList.remove("hidden");
            }).catch(error => {
                console.error(error);
                alert("Erro ao carregar dados do sensor.");
            });
        }

        function salvar(event) {
            event.preventDefault();
            const id = document.getElementById("id").value.trim().toUpperCase().replace(/\s+/g, "_");

            const dados = {
                nome: document.getElementById("nome").value.trim(),
                clientID: document.getElementById("cliente").value.trim(),
                tempMin: parseFloat(document.getElementById("tempMin").value) || null,
                tempMax: parseFloat(document.getElementById("tempMax").value) || null,
                humMin: parseFloat(document.getElementById("humMin").value) || null,
                humMax: parseFloat(document.getElementById("humMax").value) || null,
                emailAlerta: document.getElementById("emailAlerta").value.trim(),
                freqRegistro: parseInt(document.getElementById("freqRegistro").value) || 60,
                intervaloAlerta: parseInt(document.getElementById("intervaloAlerta").value) || 15,
                rotaTemp: document.getElementById("rotaTemp").value.trim(),
                rotaHum: document.getElementById("rotaHum").value.trim(),
                rotaLastSeen: document.getElementById("rotaLastSeen").value.trim(),
                
                // Grava parâmetros da Porta
                rotaPorta: document.getElementById("rotaPorta").value.trim(),
                tempoLimitePorta: parseInt(document.getElementById("tempoLimitePorta").value) || 5
            };

            db.ref(`central_sensores/${id}`).update(dados).then(() => {
                alert(editando ? "Configurações atualizadas!" : "Sensor cadastrado!");
                fecharModal();
            }).catch(error => {
                console.error(error);
                alert("Erro ao salvar alterações no Firebase.");
            });
        }

        function excluir(id) {
            if (!confirm(`Deseja excluir permanentemente o ${id}?`)) return;

            db.ref(`central_sensores/${id}`).remove().then(() => {
                alert("Sensor removido com sucesso.");
            }).catch(error => {
                console.error(error);
                alert("Erro ao excluir.");
            });
        }

        function logout() {
            auth.signOut().then(() => {
                alert("Sessão encerrada.");
            });
        }
    </script>
</body>

</html>
